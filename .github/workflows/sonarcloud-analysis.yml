# SonarCloud · Code analysis
#
# Runs a SonarCloud scan of the current commit, optionally with a coverage
# report produced earlier in the same run. Project key, organization and
# exclusions come from the calling repo's sonar-project.properties.
# If SONAR_TOKEN is not passed, the scan is skipped with a warning instead of failing.
name: SonarCloud · Code analysis

on:
  workflow_call:
    inputs:
      coverage-artifact-name:
        description: Artifact with the coverage report. '' analyses without coverage.
        type: string
        default: coverage
      coverage-path:
        description: Folder where the coverage report is restored (must match sonar-project.properties).
        type: string
        default: coverage
      sonar-host-url:
        description: SonarQube server URL.
        type: string
        default: https://sonarcloud.io
      timeout-minutes:
        description: Job timeout.
        type: number
        default: 10
    secrets:
      SONAR_TOKEN:
        description: SonarCloud token of the project. Optional; without it the scan is skipped.
        required: false

permissions:
  contents: read

jobs:
  analysis:
    name: SonarCloud analysis
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      # Full history so SonarCloud can detect new code and blame lines.
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download coverage report
        if: inputs.coverage-artifact-name != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.coverage-artifact-name }}
          path: ${{ inputs.coverage-path }}

      - name: Warn when the token is missing
        if: env.SONAR_TOKEN == ''
        run: echo "::warning::SONAR_TOKEN is not set; SonarCloud analysis skipped."

      - name: SonarCloud scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SONAR_HOST_URL: ${{ inputs.sonar-host-url }}
